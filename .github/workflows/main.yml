name: SADEE X DIMA - Build APK & Deploy Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # ANDROID APK BUILD
  # ==========================================
  build-android:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Project
        id: android
        shell: bash
        run: |

          PROJECT=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # FORCE CORRECT GRADLE VERSION
      # ==========================================
      - name: Fix Gradle Wrapper
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "===== GRADLE VERSION ====="
          cat gradle/wrapper/gradle-wrapper.properties

      # ==========================================
      # FIX REPOSITORY MODE
      # ==========================================
      - name: Fix Gradle Repository Configuration
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          echo "===== SETTINGS.GRADLE ====="
          cat settings.gradle

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # USE PROJECT GRADLE WRAPPER
      # ==========================================
      - name: Make Gradle Wrapper Executable
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          chmod +x gradlew

      - name: Check Gradle Version
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          ./gradlew --version

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # ==========================================
      # UPLOAD APK AS ARTIFACT
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # ==========================================
  # ADMIN DASHBOARD → GITHUB PAGES
  # ==========================================
  deploy-admin:

    name: Deploy Admin Dashboard

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          ADMIN=$(find extracted -type d -name "admin-dashboard" | head -n 1)

          if [ -z "$ADMIN" ]; then

            echo "admin-dashboard folder not found."

            INDEX=$(find extracted -type f -name "index.html" | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo "Admin dashboard:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages
        shell: bash
        run: |

          rm -rf public
          mkdir -p public

          cp -R "${{ steps.admin.outputs.admin }}/." public/

          echo "===== ADMIN FILES ====="
          find public -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
