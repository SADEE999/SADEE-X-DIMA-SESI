name: SADEE X DIMA - Build APK & Deploy Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # =====================================================
  # ANDROID APK
  # =====================================================

  build-android:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      - name: Extract ZIP
        shell: bash
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== EXTRACTED PROJECT ====="

          find extracted -maxdepth 5 -type f | sort


      - name: Find Android Project
        id: android
        shell: bash
        run: |

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # =================================================
      # FORCE GRADLE 8.0
      # =================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      - name: Check Gradle
        run: |

          echo "===== GRADLE VERSION ====="

          gradle --version


      # =================================================
      # FIX REPOSITORY SETTINGS
      # =================================================

      - name: Fix Gradle Repository Configuration
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          echo "===== SETTINGS.GRADLE ====="

          cat settings.gradle


      # =================================================
      # BUILD APK
      # =================================================

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # =================================================
      # UPLOAD APK
      # =================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # =====================================================
  # ADMIN DASHBOARD
  # =====================================================

  deploy-admin:

    name: Deploy Admin Dashboard

    runs-on: ubuntu-latest

    environment:

      name: github-pages

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      - name: Extract ZIP
        shell: bash
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted


      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            echo "admin-dashboard folder not found."

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo "ADMIN DASHBOARD:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      - name: Prepare Pages
        shell: bash
        run: |

          rm -rf public

          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/


          echo "===== PAGE FILES ====="

          find public -maxdepth 4 -type f | sort


      # =================================================
      # GITHUB PAGES
      # =================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public


      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
